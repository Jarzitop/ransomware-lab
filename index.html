<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050816" />
  <title>6 meses</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Fondo espacial ligero: engine + bundle Slim oficial de tsParticles -->
  <script defer src="https://cdn.jsdelivr.net/npm/@tsparticles/engine@4/tsparticles.engine.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@4/tsparticles.slim.bundle.min.js"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="space-bg" aria-hidden="true">
    <div id="tsparticles"></div>
    <div class="nebula nebula--violet"></div>
    <div class="nebula nebula--blue"></div>
    <div class="nebula nebula--rose"></div>
    <div class="cosmic-dust"></div>
    <div class="cosmic-vignette"></div>
  </div>

  <!-- ESCENA 1: Portada -->
  <section id="scene-book" class="scene scene--active">
    <div class="book-stage">
      <div class="paper-shell">
        <article class="book__page handwritten-paper" id="book-page">
          <span class="paper-tape" aria-hidden="true"></span>
          <p class="book__text" id="book-text"></p>
          <button class="book-secret" id="book-secret" type="button" aria-label="Un detalle escondido">✦</button>
        </article>
      </div>
      <button class="book__continue" id="book-continue" type="button">↵ Enter / toca para continuar</button>
    </div>
  </section>

  <!-- ESCENA 2: Galaxia / constelación -->
  <section id="scene-map" class="scene">
    <header class="map-header">
      <p class="eyebrow">nuestra constelación</p>
      <p class="map-progress" id="map-progress">0 / 7 cartas leídas</p>
      <p class="map-hint">cada punto guarda un pedacito de nosotros</p>
    </header>

    <div class="constellation-viewport" id="constellation-viewport">
      <div id="constellation-points">
        <div class="constellation-aura" aria-hidden="true"></div>
        <svg id="constellation-lines" aria-hidden="true"></svg>
        <div class="completion-flare" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Easter eggs discretos: su posición se decide en JS -->
    <div id="easter-layer" class="easter-layer" aria-label="Pequeños secretos">
      <button class="easter-egg easter-egg--nebula" id="egg-nebula" type="button" aria-label="Una nebulosa extraña"><span></span></button>
      <button class="easter-egg easter-egg--star" id="egg-star" type="button" aria-label="Una estrella diferente"><span></span></button>
      <button class="easter-egg easter-egg--comet is-hidden" id="egg-comet" type="button" aria-label="Una estrella fugaz especial"><span></span></button>
    </div>

    <button id="poem-vault-toggle" class="poem-vault-toggle is-hidden" type="button" aria-expanded="false">
      ✦ <span id="poem-count">0 / 4</span>
    </button>

    <!-- Panel de pistas -->
    <div id="clue-panel" class="clue-panel">
      <button id="clue-toggle" class="clue-toggle" type="button" aria-expanded="false">
        <span class="clue-toggle__dot"></span> pistas
      </button>
      <div id="clue-list" class="clue-list is-collapsed"></div>
      <div id="answer-box" class="answer-box is-hidden">
        <p class="answer-box__label">¿ya la descifraste?</p>
        <div id="answer-puzzle" class="answer-puzzle" aria-label="respuesta de siete letras"></div>
        <div class="answer-box__row">
          <input type="text" id="answer-input" placeholder="escribe aquí" autocomplete="off" maxlength="10" />
          <button id="answer-submit" type="button" aria-label="Comprobar respuesta">↵</button>
        </div>
        <p class="answer-box__feedback" id="answer-feedback"></p>
      </div>
    </div>

    <!-- Modal de carta mensual -->
    <div id="carta-modal" class="carta-modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="carta-titulo">
      <div class="carta-modal__backdrop" id="carta-backdrop"></div>
      <article class="carta-modal__card">
        <button class="carta-modal__close" id="carta-close" type="button" aria-label="cerrar">×</button>
        <p class="carta-modal__eyebrow" id="carta-fecha"></p>
        <h2 class="carta-modal__title" id="carta-titulo"></h2>
        <p class="carta-modal__text" id="carta-texto"></p>

        <div class="carta-modal__photos" id="carta-photos">
          <div class="photo-slot" id="photo-slot-1"><img id="photo-1" alt="" /></div>
          <div class="photo-slot" id="photo-slot-2"><img id="photo-2" alt="" /></div>
        </div>

        <div class="carta-modal__song" id="carta-song"></div>
        <button class="btn-solid" id="btn-marcar-leida" type="button">marcar como leída</button>
      </article>
    </div>
  </section>

  <!-- ESCENA 3: Carta final -->
  <section id="scene-final" class="scene">
    <div class="final-wrap">
      <p class="eyebrow">seis meses después</p>
      <div class="final-letter handwritten-paper" id="final-letter-text"></div>
    </div>
  </section>

  <!-- Biblioteca de poemas desbloqueados -->
  <aside id="poem-vault" class="poem-vault is-hidden" aria-label="Poemas encontrados">
    <div class="poem-vault__header">
      <div>
        <p class="eyebrow">hallazgos secretos</p>
        <h2>Pequeñas odas</h2>
      </div>
      <button id="poem-vault-close" type="button" aria-label="cerrar">×</button>
    </div>
    <div id="poem-list" class="poem-list"></div>
  </aside>

  <!-- Modal de poema -->
  <div id="poem-modal" class="poem-modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="poem-title">
    <div id="poem-backdrop" class="poem-modal__backdrop"></div>
    <article class="poem-paper handwritten-paper">
      <span class="paper-tape paper-tape--small" aria-hidden="true"></span>
      <button id="poem-close" class="poem-close" type="button" aria-label="cerrar">×</button>
      <p class="poem-kicker">una cosa más que quería decirte</p>
      <h2 id="poem-title"></h2>
      <p id="poem-text"></p>
      <p class="poem-signature">— tu novio</p>
    </article>
  </div>

  <div id="secret-toast" class="secret-toast" role="status" aria-live="polite"></div>
</body>
</html>
